[project]
name = "robometer-client"
version = "0.1.0"
description = "Thin HTTP client for the Robometer eval server — batch video scoring with Future-based overlap."
requires-python = ">=3.9"
authors = [
    { name = "Robometer client" },
]
dependencies = [
    "numpy>=1.21",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robometer_client"]
